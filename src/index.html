<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Akıncı: Beş Krallık</title>
<style>
html,body{margin:0;height:100%;background:#1d2a20;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{display:block;width:100vw;height:100vh;position:fixed;inset:0}
#top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 8px 0;pointer-events:none;z-index:3;gap:6px}
#badge{color:#fff;border-radius:10px;padding:5px 9px;box-shadow:0 3px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.25);display:flex;flex-direction:column;line-height:1.05;border:1px solid rgba(255,255,255,.25)}
#badge b{font-family:Georgia,"Times New Roman",serif;font-size:17px;letter-spacing:2px;color:#ffd75e;text-shadow:0 2px 0 #3a2400}
#badge span{font-size:10.5px;font-weight:700}
.res{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:240px}
.pill{background:rgba(18,20,24,.78);color:#fff;font-weight:800;font-size:13px;border-radius:14px;padding:4px 9px 4px 6px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 8px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12)}
.ic{display:inline-block;width:15px;height:15px;border-radius:4px}
.ic.f{background:radial-gradient(ellipse at 50% 40%,#fff0a0,#d9a93a 70%);border-radius:50% 50% 45% 45%}
.ic.s{background:linear-gradient(135deg,#d7dce0,#868c92)}
.ic.g{border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0a8,#f2b21b 55%,#a86d00)}
.ic.p,.ic.e{background:none;font-size:13px;width:auto;height:auto;font-style:normal}
.rb{pointer-events:auto;border:0;background:rgba(18,20,24,.78);color:#fff;border-radius:50%;width:32px;height:32px;font-size:14px;border:1px solid rgba(255,255,255,.12)}
.rb.off{opacity:.4}
#status{position:fixed;left:50%;transform:translateX(-50%);top:58px;z-index:3;pointer-events:none;font-weight:900;font-size:12.5px;color:#fff;padding:4px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#status.peace{background:rgba(30,110,80,.82)}#status.war{background:rgba(140,24,30,.85)}
#mini{position:fixed;right:8px;top:92px;width:104px;height:104px;z-index:3;pointer-events:none;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#feed{position:fixed;left:8px;top:92px;z-index:3;pointer-events:none;font-weight:800;font-size:12.5px;max-width:58vw;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.7);line-height:1.35}
#hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;z-index:3;pointer-events:none;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 8px rgba(0,0,0,.5);padding:0 14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.ft{position:absolute;left:0;top:0;font-weight:900;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.65),0 0 6px rgba(0,0,0,.45);will-change:transform,opacity}
#joy{position:fixed;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(30,36,42,.25);border:3px solid rgba(255,255,255,.65);z-index:4;pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#dfe6ea);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,14,.6);backdrop-filter:blur(3px);z-index:6;padding:14px}
.ov.hide{display:none}
.card{background:linear-gradient(180deg,#2a2622,#17140f);border:2px solid #8a6a2c;border-radius:16px;max-width:380px;width:100%;max-height:96vh;overflow:auto;padding:18px 16px 14px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6);color:#eadfc6}
.card h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:42px;letter-spacing:5px;color:#ffd75e;text-shadow:0 3px 0 #5a3a00}
.card h2{margin:2px 0 8px;font-size:13px;color:#c9a96a;letter-spacing:4px}
.card p{font-size:13.5px;margin:6px 0 10px;line-height:1.4;color:#d8ccb0}
.civs{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.civ{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:2px solid transparent;border-left:8px solid var(--c);background:rgba(255,255,255,.06);color:#eadfc6;border-radius:10px;padding:7px 10px;cursor:pointer}
.civ b{font-size:15px;color:#fff}.civ span{font-size:11.5px;opacity:.85;margin-top:2px}
.civ.sel{border-color:#ffd75e;background:rgba(255,215,94,.12)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-size:17px;font-weight:900;color:#2a1a00;background:linear-gradient(180deg,#ffd75e,#c99212);box-shadow:0 4px 0 #7a5400;margin-top:10px;cursor:pointer}
.btn.alt{background:linear-gradient(180deg,#6b6457,#45403a);color:#fff;box-shadow:0 4px 0 #2a2622}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;background:radial-gradient(circle at 50% 40%,#3a3426,#110f0b);text-align:center;font-weight:900}
#load b{display:block;font-family:Georgia,serif;font-size:44px;letter-spacing:6px;color:#ffd75e;text-shadow:0 3px 0 #5a3a00}
#load span{display:block;color:#d8ccb0;margin:6px 0 12px}
.lb{width:220px;height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin:auto}
.lb i{display:block;height:100%;width:0;background:#ffd75e;transition:width .2s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>
<div id="top">
  <div id="badge"><b>AKINCI</b><span id="lv">—</span></div>
  <div class="res">
    <div class="pill"><i class="ic e">🌾</i><span id="rf">0</span></div>
    <div class="pill"><i class="ic e">🪨</i><span id="rs">0</span></div>
    <div class="pill"><i class="ic g"></i><span id="rg">0</span></div>
    <div class="pill"><i class="ic p">👥</i><span id="rp">0</span></div>
    <button id="music" class="rb" aria-label="Müzik">🎵</button>
    <button id="mute" class="rb" aria-label="Ses">🔊</button>
  </div>
</div>
<div id="status"></div>
<canvas id="mini" width="208" height="208"></canvas>
<div id="feed"></div>
<div id="hint"></div>
<div id="joy"><div id="knob"></div></div>
<div id="ov" class="ov hide"><div class="card" id="card"></div></div>
<div id="load"><div><b>AKINCI</b><span>Beş Krallık yükleniyor…</span><div class="lb"><i id="loadbar"></i></div></div></div>
<!--GAME--><script src="../dist/bundle.js"></script><!--/GAME-->
</body>
</html>
